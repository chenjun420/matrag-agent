[project]
name = "matrag-agent"
version = "0.1.0"
description = "MATRag 产测 Agent 服务（Phase B.1 骨架）"
requires-python = ">=3.13,<3.14"
dependencies = [
    # Pydantic AI：与 MATRag P3-0 同框架同版本（spec §10 Q5：避免 API 漂移）。
    # 说明：设计文档示例写作 ">=0.7.2"，但 MATRag 主仓实际锁定
    # `pydantic-ai-slim[openai] >=2.56,<3`（P3-0 实测版本），此处对齐真实版本。
    "pydantic-ai-slim[openai]>=2.56,<3",
    "fastapi>=0.110",
    "httpx>=0.27",
    "uvicorn[standard]>=0.27",
    "pyyaml>=6.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/matrag_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
